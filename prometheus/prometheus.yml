# Reconstructed from your three previously confirmed Prometheus targets.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
  - job_name: pgx_dcgm
    scheme: http
    static_configs:
      - targets: ['pgx.tail132677.ts.net:9400']
        labels:
          instance: pgx-dcgm
  - job_name: pgx_node_exporter
    scheme: http
    static_configs:
      - targets: ['pgx.tail132677.ts.net:9100']
        labels:
          instance: pgx-node
  - job_name: pgx_vllm
    scheme: https
    static_configs:
      - targets: ['pgx.tail132677.ts.net:443']
        labels:
          instance: pgx-vllm